name: Build, Test, and Publish
on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - develop
      - development
      - alpha
      - beta
      - master
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation
        run: npm run build:ts

      - name: Run full test suite
        run: npm test

      - name: Build package
        run: npm run build

      - name: Version consistency check
        run: |
          echo "🔍 Checking version consistency across project files..."
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Package version: $PACKAGE_VERSION"

      - name: Security audit
        run: npm audit --audit-level=high --production
        continue-on-error: true

      - name: Create distribution artifact
        run: tar -czvf distrib.tar.gz src examples package.json docs index.js README.md CHANGELOG.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-${{ matrix.node }}
          path: |
            distrib.tar.gz
            src/**/*.js
            src/**/*.d.ts
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Extract version & release notes from CHANGELOG
        id: extract_changelog
        run: |
          echo "🔍 Debugging changelog extraction..."
          echo "First few lines of CHANGELOG.md:"
          head -5 CHANGELOG.md
          
          # Extract version from the first changelog entry
          FIRST_LINE=$(head -1 CHANGELOG.md)
          echo "First changelog line: '$FIRST_LINE'"
          
          # Try to extract version with square brackets first [0.2.5]
          VERSION=$(echo "$FIRST_LINE" | grep -o '\[.*\]' | tr -d '[]' | cut -d'(' -f1)
          
          # If that fails, try without square brackets ## 0.2.5
          if [ -z "$VERSION" ]; then
            echo "No square brackets found, trying without brackets..."
            VERSION=$(echo "$FIRST_LINE" | sed -E 's/^##\s+([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          
          # If still empty, try alternative patterns
          if [ -z "$VERSION" ]; then
            echo "Trying alternative pattern..."
            VERSION=$(grep -m1 '^##' CHANGELOG.md | sed -E 's/^##\s+\[?([0-9]+\.[0-9]+\.[0-9]+)\]?.*/\1/')
          fi
          
          echo "Extracted version: '$VERSION'"
          
          if [ -z "$VERSION" ]; then
            echo "❌ CRITICAL: All version extraction methods failed"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Successfully extracted version: $VERSION"

          # Extract release notes between the first and second version headers
          # This works for both ## 0.2.5 and ## [0.2.5] formats
          BODY=$(awk '
            /^##\s+(\[?[0-9]+\.[0-9]+\.[0-9]+\]?|\[[^]]+\])/ { 
              if (count == 0) { 
                count++; 
                next 
              } else { 
                exit 
              } 
            } 
            count > 0 { 
              if (/^$/ && NR > 2) next;  # Skip empty lines except at the very beginning
              print 
            }
          ' CHANGELOG.md)
          
          # Clean up the body - remove leading/trailing whitespace
          BODY=$(echo "$BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Extracted release notes (${#BODY} characters)"

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_AUTH_TOKEN }}
          access: public

      - name: Verify NPM Publication (CRITICAL)
        run: |
          echo "🔍 Verifying NPM publication..."
          echo "⏳ Waiting for NPM propagation..."
          sleep 60
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          echo "Expected version: $EXPECTED_VERSION"
          PUBLISHED_VERSION=$(npm view node-red-contrib-opcua-server-refresh version 2>/dev/null || echo "NOT_FOUND")

          if [ "$PUBLISHED_VERSION" = "NOT_FOUND" ]; then
            echo "❌ CRITICAL FAILURE: Package not found on NPM!"
            exit 1
          fi

          if [ "$PUBLISHED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ CRITICAL FAILURE: Version mismatch!"
            echo "Published: $PUBLISHED_VERSION"
            echo "Expected: $EXPECTED_VERSION"
            exit 1
          fi

          # Test installation and Node-RED config
          echo "🧪 Testing package installation..."
          mkdir -p /tmp/test-install && cd /tmp/test-install
          npm init -y >/dev/null 2>&1

          if ! npm install node-red-contrib-opcua-server-refresh@$EXPECTED_VERSION --silent; then
            echo "❌ CRITICAL FAILURE: Package installation failed!"
            exit 1
          fi

          node -e "
            const pkg = require('./node_modules/node-red-contrib-opcua-server-refresh/package.json');
            if (!pkg['node-red']) throw new Error('Missing node-red configuration');
            if (!pkg['node-red'].nodes) throw new Error('Missing node-red nodes configuration');
            console.log('✅ Node-RED configuration verified');
          "

          echo "✅ NPM publication verification PASSED"
          echo "📦 Package: node-red-contrib-opcua-server-refresh@$EXPECTED_VERSION"
          echo "🔗 NPM URL: https://www.npmjs.com/package/node-red-contrib-opcua-server-refresh"
          echo "🔔 MANUAL ACTION REQUIRED:"
          echo "1. Go to https://flows.nodered.org"
          echo "2. Click '+' button → 'node'"
          echo "3. Submit: node-red-contrib-opcua-server-refresh"
          echo "4. Monitor: https://flows.nodered.org/node/node-red-contrib-opcua-server-refresh"

      - name: Create Git Tag
        if: success()
        run: |
          VERSION="v${{ steps.extract_changelog.outputs.version }}"
          echo "Creating tag: $VERSION"
          
          # Validate version is not empty
          if [ -z "${{ steps.extract_changelog.outputs.version }}" ]; then
            echo "❌ ERROR: Version extraction failed - version is empty"
            exit 1
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch tags to ensure we have the latest
          git fetch --tags || echo "⚠️  Warning: Could not fetch tags"
          
          # Try to delete existing tag locally (ignore errors)
          git tag -d "$VERSION" 2>/dev/null || echo "ℹ️  Tag $VERSION doesn't exist locally or already deleted"
          
          # Try to delete existing tag on remote (ignore errors)
          git push --delete origin "$VERSION" 2>/dev/null || echo "ℹ️  Tag $VERSION doesn't exist on remote or already deleted"
          
          # Create the tag
          if git tag -a "$VERSION" -m "Release $VERSION"; then
            echo "✅ Successfully created tag $VERSION locally"
          else
            echo "⚠️  Warning: Could not create tag locally (may already exist)"
          fi
          
          # Push the tag (force to overwrite if exists)
          if git push origin "$VERSION" --force; then
            echo "✅ Successfully pushed tag $VERSION to remote"
          else
            echo "⚠️  Warning: Could not push tag to remote, but continuing anyway"
          fi
          
          echo "🏁 Tag creation step completed (any warnings above are non-critical)"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.extract_changelog.outputs.version }}
          name: Release v${{ steps.extract_changelog.outputs.version }}
          body: ${{ steps.extract_changelog.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
