name: Build, Test, and Publish
on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - develop
      - development
      - alpha
      - beta
      - master
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: TypeScript compilation
        run: npm run build:ts
        
      - name: Run full test suite
        run: npm test
        
      - name: Build package
        run: npm run build
        
      - name: Security audit
        run: npm audit --audit-level=high --production
        continue-on-error: true
        
      - name: Create distribution artifact
        run: tar -czvf distrib.tar.gz src examples package.json docs index.js README.md CHANGELOG.md
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-${{ matrix.node }}
          path: |
            distrib.tar.gz
            src/**/*.js
            src/**/*.d.ts
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build for production
        run: npm run build
        
      - name: Extract package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        
      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_AUTH_TOKEN }}
          access: public
          
      - name: Verify NPM Publication (CRITICAL)
        run: |
          echo "🔍 Verifying NPM publication..."
          
          # Wait for NPM propagation (NPM can take 30-60 seconds)
          echo "⏳ Waiting for NPM propagation..."
          sleep 60
          
          # Extract expected version
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          echo "Expected version: $EXPECTED_VERSION"
          
          # Verify package exists and version matches
          PUBLISHED_VERSION=$(npm view node-red-contrib-opcua-server-refresh version 2>/dev/null || echo "NOT_FOUND")
          
          if [ "$PUBLISHED_VERSION" = "NOT_FOUND" ]; then
            echo "❌ CRITICAL FAILURE: Package not found on NPM!"
            echo "This indicates NPM publication failed."
            exit 1
          fi
          
          if [ "$PUBLISHED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ CRITICAL FAILURE: Version mismatch!"
            echo "Published: $PUBLISHED_VERSION"
            echo "Expected: $EXPECTED_VERSION"
            exit 1
          fi
          
          # Test installation
          echo "🧪 Testing package installation..."
          mkdir -p /tmp/test-install && cd /tmp/test-install
          npm init -y >/dev/null 2>&1
          
          if ! npm install node-red-contrib-opcua-server-refresh@$EXPECTED_VERSION --silent; then
            echo "❌ CRITICAL FAILURE: Package installation failed!"
            exit 1
          fi
          
          # Verify Node-RED configuration
          node -e "
            const pkg = require('./node_modules/node-red-contrib-opcua-server-refresh/package.json');
            if (!pkg['node-red']) throw new Error('Missing node-red configuration');
            if (!pkg['node-red'].nodes) throw new Error('Missing node-red nodes configuration');
            console.log('✅ Node-RED configuration verified');
          "
          
          echo "✅ NPM publication verification PASSED"
          echo "📦 Package: node-red-contrib-opcua-server-refresh@$EXPECTED_VERSION"
          echo "🔗 NPM URL: https://www.npmjs.com/package/node-red-contrib-opcua-server-refresh"
          echo ""
          echo "🔔 MANUAL ACTION REQUIRED:"
          echo "1. Go to https://flows.nodered.org"
          echo "2. Click '+' button → 'node'"
          echo "3. Submit: node-red-contrib-opcua-server-refresh"
          echo "4. Monitor: https://flows.nodered.org/node/node-red-contrib-opcua-server-refresh"
          
      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          release_name: Release v${{ steps.package-version.outputs.version }}
          body: |
            ## 🎉 Version ${{ steps.package-version.outputs.version }} Release
            
            ### 🚀 Major Improvements
            - **Complete TypeScript Migration**: Enhanced developer experience with full type safety
            - **Critical Security Fixes**: Replaced vulnerable vm2 with secure Node.js vm implementation
            - **Latest node-opcua Support**: Updated to version 2.156.0 with all compatibility fixes
            - **Comprehensive Test Suite**: 61 tests with 100% pass rate ensuring reliability
            
            ### 🔒 Security Enhancements
            - Eliminated critical CVE vulnerabilities (CVE-2023-29017, CVE-2023-30547)
            - Enhanced VM sandbox security with prototype pollution protection
            - Improved input validation and error handling
            
            ### ⚡ Performance & Reliability
            - Modern TypeScript architecture for better maintainability
            - Enhanced error handling and timeout management
            - Improved build system with automated testing
            
            ### 📦 Installation
            ```bash
            npm install node-red-contrib-opcua-server-refresh
            ```
            
            ### 🔗 Links
            - **NPM Package**: https://www.npmjs.com/package/node-red-contrib-opcua-server-refresh
            - **Node-RED Catalog**: https://flows.nodered.org/node/node-red-contrib-opcua-server-refresh
            - **Documentation**: See README.md and CHANGELOG.md for detailed changes
            
          draft: false
          prerelease: false
